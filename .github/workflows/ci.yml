name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect application changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            app:
              - '**'
              - '!**/*.md'
            database:
              - 'compose.yaml'
              - 'docker/Supabase.Dockerfile'
              - 'supabase/**'
              # The integration tests exercise the data layer against a real
              # database, so changes there have to run this job too.
              - 'test/integration/**'
              - 'lib/features/**/data/**'
              - 'dart_test.yaml'

  documentation:
    name: Documentation check
    needs: changes
    if: needs.changes.outputs.app != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm documentation-only change
        run: echo 'Documentation-only change; Android checks are not required.'

  android:
    name: Android checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare cache directories
        run: mkdir -p .ci-cache/pub .ci-cache/gradle
      - name: Restore dependency caches
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'docker/Dockerfile') }}
          restore-keys: flutter-${{ runner.os }}-
      - name: Build development image
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml build
      - name: Resolve dependencies
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter pub get
      - name: Layer rules
        run: tool/check_pattern.sh && test/tool/check_pattern_test.sh

      - name: Check formatting
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter analyze
      - name: Test
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter test
      - name: Build debug APK
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter build apk --debug

  database:
    name: Database checks
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Supabase tooling image
        run: docker compose build supabase
      # `start`, not `db start`: the integration tests need the API, auth and
      # Realtime services, not only Postgres.
      - name: Start Supabase and replay migrations
        run: docker compose run --rm supabase start
      - name: Lint database
        run: docker compose run --rm supabase db lint --level error
      - name: Test database
        run: docker compose run --rm supabase test db
      - name: Prepare cache directories
        run: mkdir -p .ci-cache/pub .ci-cache/gradle
      - name: Build development image
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml build flutter
      # Skipped by the ordinary `flutter test` run; this is the only job with a
      # database for them to talk to.
      #
      # --concurrency=1: these suites share one backend. Run in parallel they
      # contend for a single Realtime container and one suite's subscriptions
      # starve the other's, which showed up as a different Realtime test timing
      # out on each run. They are integration tests against shared state; they
      # are not parallel-safe by nature.
      - name: Repository integration tests
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter test --run-skipped --tags integration --concurrency=1 test/integration
