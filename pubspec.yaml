name: sis
description: SIS — private chat by ESD.
publish_to: 'none'
version: 0.15.1

environment:
  sdk: ^3.13.2

dependencies:
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Firebase's own test doubles for its platform side (unit tests only).
  firebase_core_platform_interface: ^8.1.1
  firebase_messaging_platform_interface: ^4.10.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-manrope.txt
    - assets/fonts/OFL-sora.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
