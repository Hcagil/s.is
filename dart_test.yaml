# Integration tests talk to a running local Supabase stack, so they are skipped
# by the ordinary `flutter test` run (and by the Android CI job, which has no
# database). The Database CI job runs them explicitly:
#   flutter test --run-skipped --tags integration --concurrency=1 test/integration
#
# --concurrency=1 because they share one Supabase stack: run in parallel the
# suites contend for a single Realtime container and evict each other's
# sessions.
tags:
  integration:
    skip: "needs a running local Supabase stack"
  # Timing probes (test/speed): they print numbers and assert nothing about
  # behaviour. Run explicitly:
  #   flutter test --run-skipped --tags speed test/speed
  speed:
    skip: "timing probe; run explicitly"
  # A readiness probe for Realtime, not a test. CI runs it once before the
  # integration suites; it never belongs in the ordinary run.
  warmup:
    skip: "readiness probe; run explicitly before the integration suites"
  # The SIS Bot's Realtime probe needs a bootstrapped bot and its tokens, which
  # only test/tool/sis_bot_tool_test.sh provides; it runs the probe itself.
  sis_bot_probe:
    skip: "run by test/tool/sis_bot_tool_test.sh"
  # Reads the device log through the VM service (test/data/failures_log_mask_test.dart).
  # The ordinary run has no VM service. Run explicitly:
  #   flutter test --enable-vmservice --run-skipped --tags vmservice
  vmservice:
    skip: "needs --enable-vmservice; run explicitly"
