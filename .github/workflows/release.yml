name: Release
# Publishes only a commit CI has already passed on main. Branch protection
# deliberately lets an administrator merge past a red check (DECISIONS,
# 2026-09-21); waiting for CI here is what keeps such a merge from shipping.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  scope:
    # A push to this repository's main. Checking the event and the head
    # repository matters: a fork's pull request can come from a branch that
    # is also named main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      ship: ${{ steps.diff.outputs.ship }}
      code: ${{ steps.v.outputs.code }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      # Changes that cannot affect the artefact or the database do not publish
      # a build: publishing for them burns a versionCode.
      # ponytail: diffs the last commit only. Squash merges make that one change
      # per push; code in an earlier commit of a multi-commit push ships with
      # the next release instead.
      - name: Decide whether this change ships
        id: diff
        run: |
          if git diff --name-only HEAD^ HEAD \
              | grep -vE '^(docs/|\.github/)|\.md$|^\.git(ignore|attributes)$' >/dev/null; then
            echo ship=true >> "$GITHUB_OUTPUT"
          else
            echo ship=false >> "$GITHUB_OUTPUT"
          fi
      # One source for the version, read by the Play job and the iOS job alike,
      # so both builds carry the same number.
      - name: Compute version
        id: v
        run: |
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^version: *\([^ +]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

  publish:
    needs: scope
    if: needs.scope.outputs.ship == 'true'
    runs-on: ubuntu-24.04
    environment: play-internal
    permissions:
      contents: write
      pull-requests: read
    outputs:
      # The What's new note (base64, may be empty), reused by `distribute`
      # as TestFlight's "What to Test".
      note_b64: ${{ steps.note.outputs.b64 }}
    env:
      # The commit CI passed. GITHUB_SHA here is main's tip at trigger time,
      # which a later merge may already have moved past.
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Build toolchain image
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose build flutter
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .private && printf '%s' "$KEYSTORE_BASE64" | base64 -d > .private/upload-keystore.jks
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build signed AAB
        env:
          ANDROID_UPLOAD_KEYSTORE: /workspace/.private/upload-keystore.jks
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          docker compose run --rm -T \
            -e ANDROID_UPLOAD_KEYSTORE -e ANDROID_UPLOAD_KEY_ALIAS -e ANDROID_UPLOAD_STORE_PASSWORD -e ANDROID_UPLOAD_KEY_PASSWORD \
            flutter flutter build appbundle --release \
              --build-number=${{ needs.scope.outputs.code }} --build-name=${{ needs.scope.outputs.name }} \
              --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
              --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }} \
              --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with: { version: 2.117.0 }
      - name: Apply database migrations (schema goes forward before the app)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" && supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # The "What's new" note for this build: the `For users:` line of every PR
      # merged since the previous release (docs/DECISIONS.md, 2026-09-30). The
      # app fetches it on its first start of this build. No such line, no row,
      # so nothing is delivered. The text goes to SQL base64-encoded: PR bodies
      # are untrusted input. An existing row is left alone so an edit made in
      # the dashboard survives a re-run.
      - name: Store the What's new note for this build
        id: note
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.scope.outputs.code }}
          VERSION: ${{ needs.scope.outputs.name }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ]; then range="$prev..$SHA"; else range="$SHA^..$SHA"; fi
          note=$(git log --reverse --format=%s "$range" \
            | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p' \
            | while read -r pr; do
                echo "PR #$pr" >&2
                gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr" --jq 'select(.author_association | IN("OWNER","MEMBER","COLLABORATOR")) | .body' </dev/null | tr -d '\r' | sed -n 's/^For users: *//p' || exit 1
              done | sed '/^[[:space:]]*$/d')
          note=${note:0:3980}
          echo "Note: $note"
          if [ -z "$note" ]; then echo "No user-facing change in $range"; exit 0; fi
          note="Version $VERSION"$'\n'"$note"
          b64=$(printf '%s' "$note" | base64 -w0)
          echo "b64=$b64" >> "$GITHUB_OUTPUT"
          supabase db query --linked "insert into public.release_notes(build, note) values ($BUILD, convert_from(decode('$b64', 'base64'), 'utf8')) on conflict (build) do nothing"
      # The push sender, and notification-action, the endpoint its notification
      # buttons call (the push carries a signed token instead of a session).
      # Deployed before the trigger learns its URL, so the
      # trigger never calls a function that is not there yet. No JWT: the
      # database trigger holds none; push_targets() makes a forged call
      # harmless (docs/DECISIONS.md, 2026-09-24).
      - name: Deploy the push sender
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" FCM_SERVICE_ACCOUNT="$FCM_SERVICE_ACCOUNT"
          supabase functions deploy notification-action --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy notify-on-message --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase db query --linked "select vault.create_secret('https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/notify-on-message', 'notify_on_message_url') where not exists (select 1 from vault.secrets where name = 'notify_on_message_url')"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.esd.sis
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Tag and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.scope.outputs.name }}+${{ needs.scope.outputs.code }}" \
            --target "$SHA" --generate-notes \
            --title "SIS ${{ needs.scope.outputs.name }} (build ${{ needs.scope.outputs.code }})"
      - name: Remove signing key
        if: always()
        run: rm -f .private/upload-keystore.jks

  ios:
    # Independent of `publish` on purpose: an iOS failure shows as a red job
    # but leaves the Play release intact, and Play never waits on Apple.
    # Repository variable IOS_RELEASE=off skips it; unset means on.
    needs: scope
    if: needs.scope.outputs.ship == 'true' && vars.IOS_RELEASE != 'off'
    uses: ./.github/workflows/ios-ipa.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      build-number: ${{ needs.scope.outputs.code }}
      build-name: ${{ needs.scope.outputs.name }}
      upload: true
    secrets:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      IOS_DISTRIBUTION_KEY: ${{ secrets.IOS_DISTRIBUTION_KEY }}
    permissions:
      contents: read

  distribute:
    # Hands the uploaded TestFlight build to the tester groups. Runs only when
    # `ios` uploaded, on Linux: Apple takes 5 to 30 minutes to process a build
    # and polling on a macOS runner would bill them. It waits for `publish`
    # only to read the What's new note; nothing waits on it, and its failure
    # is a red job beside a green Play release. Safe to re-run alone.
    # Repository variable TESTFLIGHT_GROUPS (comma-separated names) picks the
    # groups; unset means `bacanaks`.
    needs: [scope, ios, publish]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo 'An App Store Connect secret is empty (KEY, KEY_ID or ISSUER_ID)' >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/asc"
          mkdir -m 700 "$dir"
          (umask 077; printf '%s\n' "$KEY" > "$dir/AuthKey_$KEY_ID.p8")
          echo "API_PRIVATE_KEYS_DIR=$dir" >> "$GITHUB_ENV"
      - name: Distribute the build to the TestFlight groups
        env:
          BUILD: ${{ needs.scope.outputs.code }}
          NOTE_B64: ${{ needs.publish.outputs.note_b64 }}
          TF_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
        run: |
          note=$(printf '%s' "$NOTE_B64" | base64 -d)
          python3 tool/asc_signing.py distribute com.esd.sis "$BUILD" "${TF_GROUPS:-bacanaks}" "$note"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
