# Robolectric installs Conscrypt as the JVM's first security provider. Then the JDK's TLS
# (SunJSSE) fails its one-time EC setup in a Robolectric sandbox, and every later HTTPS
# socket in the same test JVM fails, so tests passed or failed by class order. JVM tests use
# the JDK's TLS; a phone uses its own Conscrypt.
conscryptMode=OFF
