# Private server part: mask, check, install and check handlers (and, for mode local, prove it on a throwaway database). Used by release.yml and server-scripts.yml.
name: 'Private Server'
description: 'Mask secrets, check private state, install functions, check handlers, and run private tests.'
inputs:
  mode:
    description: 'Mode (local or linked)'
    required: false
    default: ''
  ship:
    description: 'Whether to ship'
    required: false
    default: 'true'
  expected:
    description: 'Expected private state'
    required: false
    default: ''
  words:
    description: 'Private words'
    required: false
    default: ''
  sql-b64:
    description: 'Base64 encoded SQL'
    required: false
    default: ''
  tests-b64:
    description: 'Base64 encoded tests'
    required: false
    default: ''
  pack-version:
    description: 'Pack version'
    required: false
    default: ''
  access-token:
    description: 'Supabase access token'
    required: false
    default: ''
  project-ref:
    description: 'Supabase project reference'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Mask the private words
      env:
        PRIVATE_WORDS: ${{ inputs.words }}
      shell: bash
      run: |
        set +x
        printf '%s\n' "$PRIVATE_WORDS" | while IFS= read -r w; do if [ -n "$w" ]; then echo "::add-mask::$w"; fi; done
        exit 0

    - name: Check the private secrets
      env:
        PRIVATE_EXPECTED: ${{ inputs.expected }}
        SQL: ${{ inputs.sql-b64 }}
        TESTS: ${{ inputs.tests-b64 }}
      shell: bash
      run: |
        case "$PRIVATE_EXPECTED" in ''|1) ;; *) echo '::error::PRIVATE_EXPECTED must be empty or 1'; exit 1 ;; esac
        if [ "$PRIVATE_EXPECTED" != 1 ]; then echo 'The private part is not expected.'; exit 0; fi
        { [ -n "$SQL" ] && [ -n "$TESTS" ]; } || { echo '::error::a private secret is empty'; exit 1; }

    - name: Install Supabase CLI
      if: inputs.mode == 'local' && inputs.ship == 'true'
      uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
      with:
        version: 2.117.0

    - name: Start a throwaway database with the public migrations
      if: inputs.mode == 'local' && inputs.ship == 'true'
      shell: bash
      run: supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

    - name: Install the private functions
      if: inputs.ship == 'true'
      env:
        PRIVATE_EXPECTED: ${{ inputs.expected }}
        PRIVATE_SQL_B64: ${{ inputs.sql-b64 }}
        PRIVATE_PACK_VERSION: ${{ inputs.pack-version }}
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_PROJECT_REF: ${{ inputs.project-ref }}
        MODE: ${{ inputs.mode }}
      shell: bash
      run: tool/private_install.sh "$MODE"

    - name: Check the private handlers
      if: inputs.ship == 'true'
      env:
        PRIVATE_EXPECTED: ${{ inputs.expected }}
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_PROJECT_REF: ${{ inputs.project-ref }}
        MODE: ${{ inputs.mode }}
      shell: bash
      run: |
        case "$PRIVATE_EXPECTED" in ''|1) ;; *) echo '::error::PRIVATE_EXPECTED must be empty or 1'; exit 1 ;; esac
        f=$(mktemp); trap 'rm -f "$f"' EXIT
        # shellcheck disable=SC2016
        { printf 'do $pk$ begin perform set_config(%s, %s, false); execute $pkw_$' "'private.expected'" "'$PRIVATE_EXPECTED'"; cat tool/private_check.sql; printf '$pkw_$; end $pk$;\n'; } > "$f"
        if [ "$MODE" = local ]; then
          out=$(supabase db query --local -f "$f" 2>&1) || { echo "::error::$(printf '%s\n' "$out" | grep -o 'error: .*' | head -1)"; exit 1; }
        else
          supabase db query --linked -f "$f" >/dev/null 2>&1 || { echo '::error::private check failed'; exit 1; }
        fi

    - name: Run the private tests
      if: inputs.ship == 'true' && inputs.mode == 'local' && inputs.expected == '1'
      env:
        PRIVATE_TESTS_B64: ${{ inputs.tests-b64 }}
      shell: bash
      run: |
        mkdir -p supabase/tests/private
        printf %s "$PRIVATE_TESTS_B64" | base64 -d | tar -xz -C supabase/tests/private
        supabase test db supabase/tests/private > "$RUNNER_TEMP/private-tests.log" 2>&1 || { echo "::error::private tests failed: $(grep -c '^# Failed test' "$RUNNER_TEMP/private-tests.log") failed"; exit 1; }
