name: Server scripts
# Puts the private server scripts live without an app release: no build, no store upload, no tag, no release notes, and never a database migration. Manual, main only; shares the release concurrency group so it never runs beside a release (docs/DELIVERY.md).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the server scripts go live now
        required: true
        type: string
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: read

jobs:
  guard:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$REF" != refs/heads/main ]; then echo '::error::server scripts go live from main only'; exit 1; fi
          echo "Server scripts: $REASON" >> "$GITHUB_STEP_SUMMARY"

  private-gate:
    needs: guard
    environment: play-internal
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # proves the private part on a throwaway database first, as release.yml does.
      - uses: ./.github/actions/private-server
        with:
          mode: local
          expected: ${{ vars.PRIVATE_EXPECTED }}
          words: ${{ secrets.PRIVATE_WORDS }}
          sql-b64: ${{ secrets.PRIVATE_SQL_B64 }}
          tests-b64: ${{ secrets.PRIVATE_TESTS_B64 }}
          pack-version: ${{ secrets.PRIVATE_PACK_VERSION }}

  install:
    needs: [guard, private-gate]
    environment: play-internal
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.117.0
      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Refuse when production is behind main
        run: |
          latest=$(find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort | tail -1)
          applied=$(supabase db query --linked "select max(version) from supabase_migrations.schema_migrations" 2>/dev/null | grep -Eo '[0-9]{14}' | sort | tail -1)
          [ -n "$applied" ] || { echo '::error::could not read the latest applied migration'; exit 1; }
          if [ "$applied" -lt "$latest" ]; then echo '::error::production is behind main: run the normal release'; exit 1; fi
          echo "Migrations: production $applied, main $latest" >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # installs and checks the private functions on production; one shared definition with release.yml.
      - uses: ./.github/actions/private-server
        with:
          mode: linked
          expected: ${{ vars.PRIVATE_EXPECTED }}
          words: ${{ secrets.PRIVATE_WORDS }}
          sql-b64: ${{ secrets.PRIVATE_SQL_B64 }}
          tests-b64: ${{ secrets.PRIVATE_TESTS_B64 }}
          pack-version: ${{ secrets.PRIVATE_PACK_VERSION }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
