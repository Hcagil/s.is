name: iOS IPA
# One implementation of the signed iPhone build, called by ci.yml (a pull
# request proves signing works; upload=false) and release.yml (upload=true,
# to TestFlight). Callers pass the five secrets explicitly. Signing needs only
# the App Store Connect API key: a distribution certificate and an App Store
# profile are created through the API for the run and revoked at its end, so
# no certificate, .p12 or match repository exists anywhere.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      build-number:
        description: CFBundleVersion; must rise with every upload
        required: true
        type: string
      build-name:
        description: CFBundleShortVersionString (pubspec name)
        required: true
        type: string
      upload:
        description: Upload the .ipa to TestFlight (false = signing proof only)
        required: true
        type: boolean
    secrets:
      APP_STORE_CONNECT_API_KEY:
        description: App Store Connect API key (.p8 content)
        required: true
      APP_STORE_CONNECT_KEY_ID:
        description: App Store Connect API key ID
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        description: App Store Connect issuer ID
        required: true
      APPLE_TEAM_ID:
        description: Apple Developer team ID
        required: true
      GOOGLE_SERVICE_INFO_PLIST:
        description: GoogleService-Info.plist content
        required: true

permissions:
  contents: read

jobs:
  ipa:
    name: Signed iPhone build
    # macos-26: its default Xcode is 26.x; App Store Connect refuses anything
    # built with an older iOS SDK.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # docker/Dockerfile is the single source of the Flutter version: same SDK as the Android job.
      - name: Install Flutter
        run: |
          version=$(sed -n 's/^ARG FLUTTER_VERSION=//p' docker/Dockerfile)
          test -n "$version"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST" || { echo 'GOOGLE_SERVICE_INFO_PLIST secret is empty' >&2; exit 1; }
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
      - name: Resolve dependencies
        run: flutter pub get
      # Not `flutter build ipa`: it cannot pass the API key flags, and without
      # them cloud-managed signing has no account to sign in with. Flutter
      # writes the build number, name and dart-defines into the Xcode config
      # here; xcodebuild archives and exports below.
      - name: Configure the Xcode build
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
          BUILD_NAME: ${{ inputs.build-name }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build ios --config-only --release --no-codesign \
            --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      # Only ever printed as a path. altool finds the key through API_PRIVATE_KEYS_DIR.
      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo 'An App Store Connect secret is empty (KEY, KEY_ID, ISSUER_ID or APPLE_TEAM_ID)' >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/asc"
          mkdir -m 700 "$dir"
          (umask 077; printf '%s\n' "$KEY" > "$dir/AuthKey_$KEY_ID.p8")
          echo "API_PRIVATE_KEYS_DIR=$dir" >> "$GITHUB_ENV"
      # Archived unsigned (CODE_SIGNING_ALLOWED=NO, via XCODE_XCCONFIG_FILE) on
      # purpose: an automatically signed archive asks Apple for a development
      # profile, which needs a registered device, and the team has none; a
      # distribution identity cannot be forced on it either (Xcode rejects
      # the conflict). Signing happens after the export, below.
      - name: Archive (signed)
        run: |
          xcodebuild -version
          echo 'CODE_SIGNING_ALLOWED = NO' > "$RUNNER_TEMP/unsigned.xcconfig"
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/unsigned.xcconfig"
          xcodebuild archive -quiet -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"
      # An unsigned archive carries no entitlements, and the export keeps the
      # ones it finds signed. An ad-hoc signature (allowed for codesign
      # itself, unlike for Xcode builds) puts them there; the export replaces
      # it and sets aps-environment to the profile's value (production).
      - name: Sign the archive with its entitlements
        run: |
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements \
            "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
      # A distribution certificate for this run only. Cloud-managed signing
      # cannot be used: the team's name has non-ASCII letters, and the
      # designated requirement Xcode writes compares the certificate's common
      # name in a form Apple's validation does not match, so the app must be
      # signed with an explicit requirement (below), which needs the private
      # key here. The key is generated in the job, the certificate is created
      # from it through the API and revoked in the last step but one; nothing
      # is stored anywhere.
      - name: Create the signing certificate
        run: |
          dir="$RUNNER_TEMP/sign"
          mkdir -m 700 "$dir"
          openssl req -new -newkey rsa:2048 -nodes -keyout "$dir/key.pem" -out "$dir/csr.pem" \
            -subj "/CN=sis GitHub Actions run $GITHUB_RUN_ID" 2>/dev/null
          python3 tool/asc_signing.py create "$dir/csr.pem" com.esd.sis \
            "sis ci $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$dir" | tee -a "$GITHUB_ENV"
          openssl x509 -inform der -in "$dir/cert.cer" -out "$dir/cert.pem"
          # The issuing intermediate is fetched from Apple's fixed https URL (the AIA URL in the certificate is http only;
          # certs.apple.com does not serve https).
          curl -sSf "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o "$dir/issuer.cer"
          openssl x509 -inform der -in "$dir/issuer.cer" -out "$dir/issuer.pem"
          openssl verify -partial_chain -CAfile "$dir/issuer.pem" "$dir/cert.pem" >/dev/null || { echo 'the downloaded WWDR intermediate did not issue the signing certificate' >&2; exit 1; }
          keychain="$dir/sign.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$dir/issuer.cer" -k "$keychain" >/dev/null
          security import "$dir/cert.pem" -k "$keychain" >/dev/null
          security import "$dir/key.pem" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          uuid=$(security cms -D -i "$dir/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          for profiles in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$profiles" && cp "$dir/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          done
          echo "SIGNING_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$(openssl x509 -in "$dir/cert.pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')" >> "$GITHUB_ENV"
      - name: Export for App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key><dict><key>com.esd.sis</key><string>$SIGNING_PROFILE_UUID</string></dict>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -quiet \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      # The export signs with a designated requirement on the certificate's
      # common name, which Apple rejects for this team (see above). Sign every
      # framework, then the app, again with the same identity and entitlements
      # but a requirement on the team ID, and repack the .ipa.
      - name: Sign with an explicit requirement
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          unzip -q "$ipa" -d "$RUNNER_TEMP/resign"
          app="$RUNNER_TEMP/resign/Payload/Runner.app"
          for object in "$app"/Frameworks/*.framework "$app"; do
            identifier=$(plutil -extract CFBundleIdentifier raw -o - "$object/Info.plist")
            codesign --force --sign "$SIGNING_IDENTITY" --preserve-metadata=identifier,entitlements,flags \
              --requirements "=designated => anchor apple generic and identifier \"$identifier\" and certificate leaf[subject.OU] = \"$TEAM_ID\"" \
              "$object"
          done
          rm "$ipa"
          (cd "$RUNNER_TEMP/resign" && zip -qr "$ipa" .)
      # What App Store Connect rejected once: every code object must verify,
      # satisfy its designated requirement and be signed by an Apple
      # Distribution certificate.
      - name: Check the signature
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          unzip -q "$ipa" -d "$RUNNER_TEMP/sig"
          app="$RUNNER_TEMP/sig/Payload/Runner.app"
          bad=0
          for object in "$app" "$app"/Frameworks/*.framework; do
            authority=$(codesign -dvv "$object" 2>&1 | sed -n 's/^Authority=//p' | head -1)
            echo "$(basename "$object"): ${authority:-unsigned or ad-hoc}"
            codesign -d -r- "$object" 2>&1 | sed -n 's/^designated => /  DR: /p'
            case "$authority" in "Apple Distribution: "*) ;; *) bad=1 ;; esac
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          [ "$bad" = 0 ] || { echo 'not every code object is signed for distribution' >&2; exit 1; }
      # A build signed without the production push environment installs and
      # runs but never receives a notification: fail here, not on a phone.
      - name: Check the push entitlement
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          env=$(codesign -d --entitlements :- "$RUNNER_TEMP/ipa/Payload/Runner.app" 2>/dev/null \
            | plutil -extract aps-environment raw -o - -)
          echo "aps-environment: $env"
          test "$env" = production || { echo "aps-environment is not production" >&2; exit 1; }
      # Apple's own validation (signature, SDK, entitlements, Info.plist) on
      # the pull request, so a rejection is found before the merge, not at the
      # release upload. The upload below validates again as part of itself.
      - name: Validate with App Store Connect
        if: ${{ !inputs.upload }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          xcrun altool --validate-app --type ios --file "$ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      # The certificate and profile exist for this run only. TestFlight
      # re-signs what it distributes, so revoking never touches a shipped build.
      - name: Revoke the signing certificate
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/asc" ] || exit 0
          # A failed revoke must not skip the local cleanup: keep its status,
          # clean up, then fail the step so a leftover certificate shows red.
          rc=0
          python3 tool/asc_signing.py delete "${SIGNING_CERTIFICATE_ID:--}" "${SIGNING_PROFILE_ID:--}" || rc=$?
          [ ! -f "$RUNNER_TEMP/sign/sign.keychain-db" ] || security delete-keychain "$RUNNER_TEMP/sign/sign.keychain-db" || rc=$?
          rm -rf "$RUNNER_TEMP/sign" "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          exit "$rc"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
