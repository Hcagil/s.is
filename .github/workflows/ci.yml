name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a pull request's superseded run is cancelled. A run on main is the
  # trigger for Release: cancelling it when a second merge lands minutes later
  # would leave the first merge unpublished.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect application changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            # Positive patterns only. dorny/paths-filter ORs its rules, so a
            # leading '**' matches every file INCLUDING .md and a later
            # '!**/*.md' can never subtract from it -- the old filter was
            # always true, which built an APK for every docs-only PR and made
            # the Documentation check unreachable.
            app:
              - 'lib/**'
              - 'test/**'
              - 'android/**'
              - 'ios/**'
              - 'rust/**'
              - 'rust_builder/**'
              - 'tool/**'
              - 'docker/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'dart_test.yaml'
              - 'compose.yaml'
              - '.github/workflows/**'
              - '.github/compose.ci.yaml'
            database:
              # Widened deliberately: the database job must run for any
              # change that can affect app/database behaviour, not only
              # direct supabase/** edits -- an app-only PR used to skip it.
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'dart_test.yaml'
              - 'compose.yaml'
              - 'docker/Supabase.Dockerfile'
              - 'supabase/**'
              - '.github/compose.ci.yaml'
              - '.github/workflows/**'

  documentation:
    name: Documentation check
    needs: changes
    if: needs.changes.outputs.app != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm documentation-only change
        run: echo 'Documentation-only change; Android checks are not required.'

  android:
    name: Android checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare cache directories
        run: mkdir -p .ci-cache/pub .ci-cache/gradle .ci-cache/m2
      - name: Restore dependency caches
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .ci-cache
            .dart_tool/hooks_runner/shared/sqlite3
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'docker/Dockerfile') }}
          restore-keys: flutter-${{ runner.os }}-
      - name: Restore the Rust codegen tools
        id: cargo-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: docker/cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('docker/Dockerfile') }}
      - name: Build development image
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml build
      - name: Keep the Rust codegen tools for the next run
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm -T flutter sh -c 'cp "$CARGO_HOME/bin/flutter_rust_bridge_codegen" "$CARGO_HOME/bin/cbindgen" /workspace/docker/cargo-tools/'
      - name: Resolve dependencies
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter pub get
      - name: Layer rules
        run: tool/check_pattern.sh && test/tool/check_pattern_test.sh && test/tool/whats_new_note_test.sh && test/tool/ios_release_test.sh && test/tool/workflow_pipes_test.sh && test/tool/asc_signing_test.py && test/tool/ios_signing_bootstrap_test.py && test/tool/asc_tester_test.py && test/tool/admin_apple_workflow_test.sh && test/tool/sis_bot_watch_test.sh && test/tool/check_pr_body_test.py

      - name: Check formatting
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter analyze
      # test/data/crypto runs against the real Rust library; RustLib.init() loads it from rust/target/release.
      - name: Build the Rust library for the Dart tests
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter cargo build --release --manifest-path rust/Cargo.toml
      # A non-UTC zone on purpose: the container defaults to UTC, where a test
      # of local-time formatting passes whether or not the code converts to
      # local time at all. POSIX form, so no tzdata is needed.
      - name: Test
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm -e TZ=JST-9 flutter flutter test
      # Before the unit tests: the debug build runs processDebugGoogleServices,
      # which needs this file.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      # JVM unit tests of the native Kotlin (android/app/src/test); they share
      # fixed vectors with the Dart tests (test/fixtures/instant_push_vectors.json).
      # android/gradlew is generated, not tracked; --config-only creates it on a clean checkout.
      - name: Android unit tests
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter sh -c 'flutter build apk --config-only && cd android && ./gradlew --no-daemon :app:testDebugUnitTest'
      # Release mode, not debug: R8 shrinking and the signing config only run
      # in a release build, and the Release workflow after merge is the wrong
      # place to find out they break. A throwaway key stands in for the upload
      # key, which never leaves the play-internal environment.
      - name: Build release bundle
        run: |
          docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm \
            -e ANDROID_UPLOAD_KEYSTORE=/tmp/ci.jks -e ANDROID_UPLOAD_KEY_ALIAS=ci \
            -e ANDROID_UPLOAD_STORE_PASSWORD=throwaway -e ANDROID_UPLOAD_KEY_PASSWORD=throwaway \
            flutter sh -c 'keytool -genkeypair -noprompt -keystore /tmp/ci.jks -alias ci \
                -storepass throwaway -keypass throwaway -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci \
              && flutter build appbundle --release'

  database:
    name: Database checks
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Supabase tooling image
        run: docker compose build supabase
      # `start`, not `db start`: the integration tests need the API, auth and
      # Realtime services, not only Postgres.
      #
      # -x excludes containers nothing here talks to (grepped: no test
      # references mailpit, postgres-meta, studio, edge-runtime, logflare,
      # vector, imgproxy or supavisor -- the pooler is already `enabled =
      # false` in supabase/config.toml, imgproxy only serves the Pro-only
      # image_transformation feature, which is disabled). On a GH-hosted
      # runner's 2 vCPUs those extra containers (Logflare and Vector
      # especially) compete with Realtime's replication for CPU; that contention, not
      # Realtime itself, is why message delivery lags far more here than on a
      # developer machine with cores to spare (see docs/DECISIONS.md).
      - name: Start Supabase and replay migrations
        run: docker compose run --rm supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Lint database
        run: docker compose run --rm supabase db lint --level error
      - name: Test database
        run: docker compose run --rm supabase test db
      # Against the real local stack (Deno's own test runner, not Flutter's):
      # what push_targets() says about each recipient -> what the function
      # sends FCM. --add-host: the stack publishes on the runner's host, the
      # same way the flutter service reaches it (see compose.yaml).
      - name: Edge function tests
        run: |
          SUPABASE_TEST_SERVICE_KEY=$(docker compose run --rm supabase status -o env | sed -n 's/^SECRET_KEY="\(.*\)"/\1/p')
          echo "::add-mask::$SUPABASE_TEST_SERVICE_KEY"
          test -n "$SUPABASE_TEST_SERVICE_KEY"
          docker run --rm --add-host host.docker.internal:host-gateway \
            -v "$PWD":/w -w /w -e SUPABASE_TEST_SERVICE_KEY="$SUPABASE_TEST_SERVICE_KEY" \
            ghcr.io/denoland/deno:2.9.7@sha256:fa335acdf6b72106eda2cb6a8cb5f4187e7630e357467489db4b2e7352d5e432 \
            test --no-check --no-lock --allow-all test/edge/
      - name: Prepare cache directories
        run: mkdir -p .ci-cache/pub .ci-cache/gradle
      # The sqlite3 build hook downloads a prebuilt library (hash-checked) from github.com; keep it between runs.
      - name: Restore the sqlite3 library cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3-hook-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Restore the Rust codegen tools
        id: cargo-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: docker/cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('docker/Dockerfile') }}
      - name: Build development image
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml build flutter
      - name: Keep the Rust codegen tools for the next run
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm -T flutter sh -c 'cp "$CARGO_HOME/bin/flutter_rust_bridge_codegen" "$CARGO_HOME/bin/cbindgen" /workspace/docker/cargo-tools/'
      # Skipped by the ordinary `flutter test` run; this is the only job with a
      # database for them to talk to.
      #
      # --concurrency=1: these suites share one backend. Run in parallel they
      # contend for a single Realtime container and one suite's subscriptions
      # starve the other's, which showed up as a different Realtime test timing
      # out on each run. They are integration tests against shared state; they
      # are not parallel-safe by nature.
      # Realtime accepts a subscription and reports "subscribed" before its
      # replication pipeline delivers anything, so the first suite to run
      # would time out on a message published into a pipeline nobody was
      # reading yet. This blocks until it genuinely delivers once -- a
      # readiness gate, not a longer timeout.
      # test/integration/key_directory_seam_test.dart drives the real Rust
      # library (vodozemac); RustLib.init() loads it from rust/target/release.
      - name: Build the Rust library for the Dart tests
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter cargo build --release --manifest-path rust/Cargo.toml
      - name: Wait until Realtime delivers
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm flutter flutter test --run-skipped --tags warmup test/integration/realtime_warmup_test.dart
      - name: Repository integration tests
        # TZ as for the unit tests: a timestamp parsed without its offset only
        # fails outside UTC, and the runner is UTC. The local stack's
        # service-role key comes from the stack itself, never the repository
        # (test/support/service_key.dart).
        run: |
          export LOCAL_UID=$(id -u) LOCAL_GID=$(id -g)
          SUPABASE_TEST_SERVICE_KEY=$(docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm supabase status -o env | sed -n 's/^SECRET_KEY="\(.*\)"/\1/p')
          echo "::add-mask::$SUPABASE_TEST_SERVICE_KEY"
          test -n "$SUPABASE_TEST_SERVICE_KEY"
          docker compose -f compose.yaml -f .github/compose.ci.yaml run --rm -e TZ=JST-9 -e SUPABASE_TEST_SERVICE_KEY="$SUPABASE_TEST_SERVICE_KEY" flutter flutter test --run-skipped --tags integration --concurrency=1 test/integration
      # Last: it bootstraps the SIS Bot on this stack through both tools
      # (tool/sis_bot_admin.sh with the stack's own local keys, never a
      # repository secret), drives tool/sis_bot.sh's read/send/start and every
      # exit code, probes the bot's real JWT, then deletes the bot again.
      - name: SIS Bot tool test
        run: |
          export LOCAL_UID=$(id -u) LOCAL_GID=$(id -g)
          SIS_BOT_TEST_COMPOSE="docker compose -f compose.yaml -f .github/compose.ci.yaml" test/tool/sis_bot_tool_test.sh

  # Proves the iOS project compiles (unsigned). Signing is proved by ios-signed below.
  ios:
    name: iOS build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Same image as ios-ipa.yml, so the pull request compiles with the SDK the release ships.
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # docker/Dockerfile is the single source of the Flutter version: same SDK as the Android job.
      - name: Install Flutter
        run: |
          version=$(sed -n 's/^ARG FLUTTER_VERSION=//p' docker/Dockerfile)
          test -n "$version"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      # The sqlite3 build hook downloads a prebuilt library (hash-checked) from github.com; keep it between runs.
      - name: Restore the sqlite3 library cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3-hook-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST" || { echo 'GOOGLE_SERVICE_INFO_PLIST secret is empty' >&2; exit 1; }
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      # The iPhone notification extension will call the same Rust crate from Swift (C header from cbindgen).
      # This compiles and links a Swift probe against the crate for the simulator.
      - name: Swift calls the Rust crate (notification extension route)
        timeout-minutes: 15
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo build --release --target aarch64-apple-ios-sim
          mkdir -p "$RUNNER_TEMP/probe"
          printf 'import Foundation\nexit(sis_olm_selftest())\n' > "$RUNNER_TEMP/probe/main.swift"
          xcrun --sdk iphonesimulator swiftc -target arm64-apple-ios15.0-simulator \
            -import-objc-header include/sis_crypto.h \
            "$RUNNER_TEMP/probe/main.swift" target/aarch64-apple-ios-sim/release/librust_lib_sis.a \
            -framework Security -o "$RUNNER_TEMP/probe/probe"
      # ios/RunnerTests: the Swift channel handlers against real ImageIO/PhotosUI,
      # hosted in the app on a simulator (whichever iPhone this Xcode ships).
      # -quiet hides why a test failed; on a failure the result bundle's
      # summary prints each failing assertion's message.
      - name: Native iOS tests (simulator)
        run: |
          flutter build ios --config-only --simulator --debug
          devices=$(xcrun simctl list devices available)
          udid=$(grep -m1 -E '^ +iPhone' <<<"$devices" | grep -oE '[0-9A-F-]{36}')
          test -n "$udid"
          results="$RUNNER_TEMP/RunnerTests.xcresult"
          xcodebuild test -quiet -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "id=$udid" -resultBundlePath "$results" CODE_SIGNING_ALLOWED=NO || {
            rc=$?
            xcrun xcresulttool get test-results summary --path "$results" || true
            exit "$rc"
          }
      # The video copy and its real AVFoundation read, on a booted simulator.
      # Normally ~11 of the 20 minutes: boot ~1-2, flutter's own start ~3-4,
      # the cold Xcode build ~4-6, then install, launch and the 3 tests ~1.
      # That last phase once hung silently until the step limit. It gets its
      # own clock, started by flutter's "Xcode build done" line, and each call
      # in the test has its own timeout, so a hang fails in minutes, named.
      - name: Video prep integration test (simulator)
        timeout-minutes: 20
        run: |
          devices=$(xcrun simctl list devices available)
          udid=$(grep -m1 -E '^ +iPhone' <<<"$devices" | grep -oE '[0-9A-F-]{36}')
          test -n "$udid"
          xcrun simctl bootstatus "$udid" -b
          log="$RUNNER_TEMP/video-prep.log"
          : > "$log"
          tail -f "$log" &
          tail_pid=$!
          flutter test integration_test/video_source_prep_ios_test.dart -d "$udid" > "$log" 2>&1 &
          pid=$!
          limit=${VIDEO_PREP_AFTER_BUILD_S:-240}
          waited=0
          while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$limit" ]; do
            sleep 1
            grep -q 'Xcode build done' "$log" && waited=$((waited + 1))
          done
          rc=0
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::video prep test: no result ${limit}s after the Xcode build (stuck installing, launching or reaching the app); stopped"
            kill "$pid"
            rc=1
          else
            wait "$pid" || rc=$?
          fi
          sleep 1
          kill "$tail_pid"
          exit "$rc"

  # Signing proof on the pull request: the same signed archive + export the
  # Release workflow uploads (.github/workflows/ios-ipa.yml), without the
  # upload. Same-repository pull requests only: a fork's run has no secrets,
  # and Dependabot's secrets are a separate store.
  ios-signed:
    name: iOS signed build
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/ios-ipa.yml
    with:
      ref: ${{ github.sha }}
      build-number: ${{ github.run_number }}
      build-name: 0.0.0
      upload: false
    secrets:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      IOS_DISTRIBUTION_KEY: ${{ secrets.IOS_DISTRIBUTION_KEY }}
