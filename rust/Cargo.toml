[package]
name = "rust_lib_sis"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-proprietary"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
log = "0.4"
vodozemac = "=0.11.2"
serde_json = "1"
x25519-dalek = "3"
hkdf = "0.13"
chacha20poly1305 = "0.11"
sha2 = "0.11"
getrandom = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
