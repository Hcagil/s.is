services:
  flutter:
    platform: linux/amd64
    build:
      context: ./docker
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /workspace
    # Lets the integration tests reach the Supabase stack the CLI publishes on
    # the host (the unit tests never touch the network).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/workspace
      - android-home:/home/ubuntu/.android
      - android-sdk:/opt/android-sdk
      - pub-cache:/home/ubuntu/.pub-cache
      - gradle-cache:/home/ubuntu/.gradle
    stdin_open: true
    tty: true

  supabase:
    build:
      context: ./docker
      dockerfile: Supabase.Dockerfile
    working_dir: ${PWD}
    environment:
      SUPABASE_SERVICES_HOSTNAME: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}

volumes:
  android-home:
  android-sdk:
  pub-cache:
  gradle-cache:
