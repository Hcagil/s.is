name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']   # documentation-only merges do not publish a build
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compute version
        id: v
        run: |
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^version: *\([^ +]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build toolchain image
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose build flutter
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .private && printf '%s' "$KEYSTORE_BASE64" | base64 -d > .private/upload-keystore.jks
      - name: Build signed AAB
        env:
          ANDROID_UPLOAD_KEYSTORE: /workspace/.private/upload-keystore.jks
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          docker compose run --rm -T \
            -e ANDROID_UPLOAD_KEYSTORE -e ANDROID_UPLOAD_KEY_ALIAS -e ANDROID_UPLOAD_STORE_PASSWORD -e ANDROID_UPLOAD_KEY_PASSWORD \
            flutter flutter build appbundle --release \
              --build-number=${{ steps.v.outputs.code }} --build-name=${{ steps.v.outputs.name }} \
              --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
              --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }} \
              --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with: { version: 2.117.0 }
      - name: Apply database migrations (schema goes forward before the app)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" && supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.esd.sis
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Tag and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.name }}+${{ steps.v.outputs.code }}" \
            --target "$GITHUB_SHA" --generate-notes \
            --title "SIS ${{ steps.v.outputs.name }} (build ${{ steps.v.outputs.code }})"
      - name: Remove signing key
        if: always()
        run: rm -f .private/upload-keystore.jks
