name: sis
description: SIS — private chat by ESD.
publish_to: 'none'
version: 0.30.17

environment:
  sdk: ^3.13.2

dependencies:
  clock: ^1.1.2
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_contacts: ^2.6.0
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.2
  # iOS implementation with Swift Package Manager support (the repo has no Podfile).
  google_maps_flutter_ios_sdk9: ^2.19.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  in_app_update: ^5.0.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  light_compressor_v2: ^1.9.1
  mime: ^2.0.0
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  record: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  video_player: ^2.14.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Firebase's own test doubles for its platform side (unit tests only).
  firebase_core_platform_interface: ^8.1.1
  firebase_messaging_platform_interface: ^4.10.0
  # Test doubles for the Google sign-in and url_launcher platform sides.
  google_sign_in_platform_interface: ^3.1.0
  url_launcher_platform_interface: ^2.3.2
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL-manrope.txt
    - assets/fonts/OFL-sora.txt
    - assets/stickers/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
