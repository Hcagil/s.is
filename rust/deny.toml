# Known-vulnerability gate for rust/Cargo.lock (docs/DELIVERY.md).
# Vulnerabilities always fail. An ignore needs its RUSTSEC id and a one-line reason above it.
[advisories]
unsound = "all"
# cargo-deny 0.20 can only fail or ignore unmaintained notices; it cannot warn. Ignored so they never block a build.
unmaintained = "none"
yanked = "warn"
ignore = []
